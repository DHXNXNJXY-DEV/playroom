<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SODIUM++ | Krunker Client</title>
    
    <!-- Minecraft Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* Modern CSS Reset & Performance Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            contain: strict;
        }

        /* Screen Wrapper - Zero margin borderless container */
        #viewport-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            contain: strict;
        }

        /* 
           Game Viewport Container:
           Establishes exact aspect ratio frame, then scales horizontally to fill 100vw edge-to-edge.
           This produces the authentic CS2 fatter/wider player models effect without black bars or HUD cutoffs.
        */
        #game-viewport {
            position: absolute;
            top: 0;
            left: 50%;
            height: 100vh;
            width: calc(100vh * (4 / 3)); /* 4:3 baseline fov */
            margin-left: calc(-1 * (100vh * (4 / 3)) / 2);
            /* Stretch horizontally to fill screen width edge-to-edge (scaleX = 100vw / (100vh * 4 / 3)) */
            transform: scaleX(calc(100vw / (100vh * (4 / 3))));
            transform-origin: center center;
            will-change: transform, width, margin-left;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform-style: preserve-3d;
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), width 0.15s cubic-bezier(0.16, 1, 0.3, 1), margin-left 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Aspect Ratio Presets (Zero Black Bars) */

        /* CS2 4:3 Stretched (Default - 1280x960 stretched equivalent) */
        #game-viewport.mode-4-3 {
            width: calc(100vh * (4 / 3));
            margin-left: calc(-1 * (100vh * (4 / 3)) / 2);
            transform: scaleX(calc(100vw / (100vh * (4 / 3))));
        }

        /* CS2 5:4 Ultra-Stretched (1280x1024 stretched equivalent - max player model width) */
        #game-viewport.mode-5-4 {
            width: calc(100vh * (5 / 4));
            margin-left: calc(-1 * (100vh * (5 / 4)) / 2);
            transform: scaleX(calc(100vw / (100vh * (5 / 4))));
        }

        /* CS2 16:10 Stretched (1440x900 stretched equivalent - balanced FOV & width) */
        #game-viewport.mode-16-10 {
            width: calc(100vh * (16 / 10));
            margin-left: calc(-1 * (100vh * (16 / 10)) / 2);
            transform: scaleX(calc(100vw / (100vh * (16 / 10))));
        }

        /* Native 16:9 Standard */
        #game-viewport.mode-16-9 {
            width: 100vw;
            margin-left: -50vw;
            transform: scaleX(1);
        }

        /* Hardware Accelerated Embed Frame */
        iframe {
            border: none;
            outline: none;
            width: 100%;
            height: 100%;
            background: #000000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transform: translateZ(0); /* GPU Compositing Trigger */
        }

        /* Startup Animation Overlay */
        #startup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 9999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 28px;
            opacity: 1;
            transition: opacity 0.6s ease-in-out;
            pointer-events: auto;
        }

        #startup-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .startup-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            animation: logoFadeIn 0.8s ease-out forwards;
        }

        .startup-title {
            font-family: 'Press Start 2P', monospace;
            color: #ffffff;
            font-size: 32px;
            letter-spacing: 2px;
            text-shadow: 4px 4px 0px #222222;
            animation: textFadeIn 1s ease-out forwards;
        }

        @keyframes logoFadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes textFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glassmorphic Auto-Hiding Toast Notification */
        #toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px) scale(0.95);
            z-index: 999999;
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        #toast .badge {
            background: #fbc02d;
            color: #000000;
            font-weight: 800;
            font-size: 10px;
            padding: 3px 7px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- SODIUM++ Startup Overlay -->
    <div id="startup-overlay">
        <img class="startup-logo" src="https://cdn.modrinth.com/data/u5AITekq/d10b40dd6b793be85d4685a0f40a32df94e033e8.png" alt="Sodium Logo">
        <div class="startup-title">SODIUM++</div>
    </div>

    <div id="viewport-wrapper">
        <div id="game-viewport" class="mode-4-3">
            <iframe id="krunker-frame" 
                    src="https://astrastrike.fun" 
                    allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; microphone; camera; pointer-lock">
            </iframe>
        </div>
    </div>

    <div id="toast">
        <span class="badge" id="toast-badge">CS2</span>
        <span id="toast-text">4:3 Stretched Viewport Active</span>
    </div>

    <script>
        const viewport = document.getElementById('game-viewport');
        const frame = document.getElementById('krunker-frame');
        const toast = document.getElementById('toast');
        const toastBadge = document.getElementById('toast-badge');
        const toastText = document.getElementById('toast-text');
        const startupOverlay = document.getElementById('startup-overlay');

        // CS2 Aspect Ratio Presets
        const PRESETS = [
            { id: 'mode-4-3', badge: 'CS2 4:3', label: '4:3 Stretched (Default CS2 - 1.333x)' },
            { id: 'mode-5-4', badge: 'CS2 5:4', label: '5:4 Ultra-Stretched (Fatter Models - 1.6x)' },
            { id: 'mode-16-10', badge: 'CS2 16:10', label: '16:10 Stretched (Slight Stretch - 1.125x)' },
            { id: 'mode-16-9', badge: 'NATIVE', label: 'Native 16:9 Widescreen' }
        ];

        let currentPresetIndex = 0;
        let toastTimeout = null;

        // Display floating toast message
        function showToast(badge, text) {
            toastBadge.innerText = badge;
            toastText.innerText = text;
            toast.classList.add('visible');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('visible');
            }, 1500);
        }

        // Cycle through CS2 aspect ratio presets
        function cyclePreset() {
            viewport.classList.remove(PRESETS[currentPresetIndex].id);
            currentPresetIndex = (currentPresetIndex + 1) % PRESETS.length;
            const newPreset = PRESETS[currentPresetIndex];
            viewport.classList.add(newPreset.id);

            showToast(newPreset.badge, newPreset.label);
        }

        // Toggle Fullscreen Mode
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    showToast('FULLSCREEN', 'Enabled');
                }).catch(() => {
                    showToast('FULLSCREEN', 'Unavailable');
                });
            } else {
                document.exitFullscreen().then(() => {
                    showToast('FULLSCREEN', 'Disabled');
                });
            }
        }

        // Fast Session Reconnect / Reload
        function reloadSession() {
            frame.src = frame.src;
            showToast('RECONNECT', 'Reloading astrastrike.fun Session...');
        }

        // Register Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            // F8 or Alt + S -> Cycle CS2 Stretched Presets
            if (e.key === 'F8' || (e.altKey && (e.key === 's' || e.key === 'S'))) {
                e.preventDefault();
                cyclePreset();
            }

            // F11 or Alt + F -> Toggle Fullscreen
            if (e.key === 'F11' || (e.altKey && (e.key === 'f' || e.key === 'F'))) {
                e.preventDefault();
                toggleFullscreen();
            }

            // Alt + R -> Instant Reconnect / Game Reload
            if (e.altKey && (e.key === 'r' || e.key === 'R')) {
                e.preventDefault();
                reloadSession();
            }
        });

        // Ensure mouse click redirects focus into iframe for pointer lock
        window.addEventListener('click', () => {
            if (document.activeElement !== frame) {
                frame.focus();
            }
        });

        // Startup Animation Handling
        window.addEventListener('load', () => {
            setTimeout(() => {
                startupOverlay.classList.add('fade-out');
                setTimeout(() => {
                    startupOverlay.style.display = 'none';
                    showToast('Astrastrike', '4:3 Stretched Active (F8 or Alt+S to cycle)');
                }, 600);
            }, 2000);
        });
    </script>
</body>
</html>
